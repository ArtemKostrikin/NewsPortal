<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>
    <h2>Привет, {{ user.username }}! Вот что ты пропустил за неделю:</h2>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ link }}{% url 'post_detail' post.id %}">{{ post.title }}</a>
                ({{ post.time_in|date:"d.m.Y" }})
            </li>
        {% endfor %}
    </ul>
    <p>Заходи на наш <a href="{{ link }}">сайт</a>, чтобы прочитать полностью!</p>
</body>
</html>
